<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/assets/img/g-favicon.png">
    <title>{{ or .error_name "INTERNAL SERVER ERROR" }}</title>
    <link rel="stylesheet" href="/assets/css/header-footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/assets/css/responsivity.css">
    <link rel="stylesheet" href="/assets/css/error.css">
</head>
<body>
    {{template "header"}}
    <div id="error-container">
        <div id="error-infos">
            <h2>
                <span id="error-code">{{ or .error_code "500" }}</span><br>
                <span id="error-title">{{ or .error_name "INTERNAL SERVER ERROR" }}</span>
            </h2>
            <a href="/" id="error-home-link"><i class="fa-solid fa-arrow-left"></i> Retour à l'Accueil</a>
        </div>
    </div>

    {{template "footer"}}

    <script>
        document.querySelector("#header").style.backgroundColor = "white";
        document.querySelector("#header").style.color = "black";
        document.querySelector("#header").style.boxShadow = "0px 4px 6px rgba(0, 0, 0, 0.1)";
        document.querySelector("#logo").innerHTML = '<b style="color:#14213d;">g</b><b style="color:#7e8d85;">t</b><b style="color:#720026;">.</b>';
        
        document.querySelector("#logo").addEventListener("click", function(){
            location.href = "/";
        });
    </script>
</body>
</html>
